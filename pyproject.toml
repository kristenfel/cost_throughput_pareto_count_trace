[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kristenfel-cost_throughput_pareto_count_trace"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出广告召回与排序工程师·成本与吞吐的帕累托边界上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kristenfel" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kristenfel.github.io"
Repository = "https://github.com/kristenfel/cost_throughput_pareto_count_trace"
Issues = "https://github.com/kristenfel/cost_throughput_pareto_count_trace/issues"

[project.scripts]
cost_throughput_pareto_count_trace = "cost_throughput_pareto_count_trace:main"

[tool.setuptools]
py-modules = ["cost_throughput_pareto_count_trace"]
